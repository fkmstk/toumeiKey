<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>TypingOverlay</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/bar.css">
  <script type="module" src="js/bar.js"></script>
</head>
<body>
  <div id="card" class="card">
    <div class="row">
      <div class="col" id="text">
        <div class="stats" id="stats"></div>
        <div class="display" id="display"></div>
        <div class="kana" id="kana"></div>
        <div class="romaji" id="romaji"></div>
        <div class="progress"><div id="bar"></div></div>
        <div class="next" id="next"></div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="kbd" id="kbd"></div>
    </div>
    <div class="controls" id="controls">
      <div class="seg" id="modes"></div>
      <span class="sep"></span>
      <button id="btn-analytics" class="icon" title="統計・分析 (⌘S / Ctrl+S)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V4M19 20v-10" stroke-width="2.6"/></svg></button>
      <button id="btn-settings" class="icon" title="設定 (⌘, / Ctrl+,)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button id="btn-hide" class="icon" title="終了 (⌘Q / Ctrl+Q)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</body>
</html>
